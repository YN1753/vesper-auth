<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授权确认 - Vesper Auth</title>
  <link rel="stylesheet" href="/static/css/vesper.css">
</head>
<body>
  <main class="auth-viewport">
    <section class="glass-card auth-card">
      <div class="brand-header">
        <div class="brand-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l7 4v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-4z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">授权确认</h1>
          <p class="brand-sub">{{.Username}} ({{.Email}})</p>
        </div>
      </div>

      <p class="section-lead">
        应用 <strong>{{.ClientName}}</strong> 正在请求通过 Vesper Auth 登录并获取以下权限：
      </p>

      <div class="kv-table" style="margin-bottom: 16px;">
        <div class="kv-row">
          <div>
            <div class="kv-key">回调目标域名</div>
            <div class="kv-val">{{.CallbackHost}}</div>
          </div>
        </div>
        <div class="kv-row">
          <div>
            <div class="kv-key">完整回调地址 (redirect_uri)</div>
            <div class="kv-val">{{.RedirectURI}}</div>
          </div>
        </div>
      </div>

      <ul class="scope-list">
        {{range .Scopes}}
        <li class="scope-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <div>
            <div class="scope-name">{{.Name}}</div>
            <div class="scope-desc">{{.Description}}</div>
          </div>
        </li>
        {{end}}
      </ul>

      <form method="POST" action="/oauth2/authorize">
        <input type="hidden" name="req" value="{{.RequestID}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div class="btn-row">
          <button class="btn btn-secondary" type="submit" name="decision" value="deny">拒绝</button>
          <button class="btn btn-primary" type="submit" name="decision" value="approve">同意授权</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
