<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>确认退出登录 - Vesper Auth</title>
  <link rel="stylesheet" href="{{asset "/static/css/vesper.css"}}">
</head>
<body>
  <main class="auth-viewport">
    <section class="glass-card auth-card">
      <div class="brand-header">
        <div class="brand-mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">确认退出登录</h1>
          <p class="brand-sub">{{.Username}} ({{.Email}})</p>
        </div>
      </div>

      <p class="section-lead">确定要结束当前浏览器在 Vesper Auth 的单点登录会话吗？</p>

      <form method="POST" action="/oauth2/logout">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <input type="hidden" name="client_id" value="{{.ClientID}}">
        <input type="hidden" name="post_logout_redirect_uri" value="{{.PostLogoutRedirectURI}}">
        <input type="hidden" name="state" value="{{.State}}">
        <div class="btn-row">
          <a class="btn btn-secondary" href="/">取消</a>
          <button class="btn btn-primary" type="submit">确认退出</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
